[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "async-rl"
version = "0.1.0"
description = "Phase 1 async RL: Python GRPO trainer + Go rollout manager"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
train = [
  "torch>=2.2",
  "transformers>=4.44",
  "peft>=0.12",
  "accelerate>=0.33",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
async-rl-train = "async_rl.train:main"

[tool.setuptools.packages.find]
where = ["trainer"]

[tool.pytest.ini_options]
testpaths = ["trainer/tests"]
pythonpath = ["trainer"]